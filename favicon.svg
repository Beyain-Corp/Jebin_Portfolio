<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="jjGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Main Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="140" fill="url(#jjGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="18" y="18" width="476" height="476" rx="138" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" />

  <!-- "JJ" Typography -->
  <text x="246" y="276" 
        text-anchor="middle" 
        dominant-baseline="central" 
        fill="#ffffff" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="244" 
        font-weight="800" 
        letter-spacing="-8">JJ</text>

  <!-- Status Emerald Dot (Signature Indicator) -->
  <circle cx="418" cy="418" r="48" fill="#0b0f19" />
  <circle cx="418" cy="418" r="38" fill="#10b981" />
</svg>
