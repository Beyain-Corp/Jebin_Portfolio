name: Sync Notion Articles to Portfolio

on:
  # Allows manual 1-click trigger from GitHub Actions tab
  workflow_dispatch:

  # Optional automated sync every 6 hours
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync-notion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch & Sync Articles from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          node scripts/sync-notion.js

      - name: Commit and Push Updated Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status -s assets/data/articles.json) ]]; then
            echo "Changes detected in assets/data/articles.json. Committing..."
            git add assets/data/articles.json
            git commit -m "chore(cms): sync latest articles from Notion [skip ci]"
            git push
            echo "Successfully synced and pushed latest Notion content!"
          else
            echo "No changes detected in Notion articles. Skipping commit."
          fi

